name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CCACHE_DIR: ${{ github.workspace }}/.local/ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_COMPRESS: '1'
  CCACHE_MAXSIZE: 256M
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y cmake ccache libboost-system-dev libssl-dev libsqlite3-dev nlohmann-json3-dev clang-format
      - uses: actions/cache/restore@v4
        id: compiler-cache
        with:
          path: .local/ccache
          key: native-${{ runner.os }}-${{ runner.arch }}-regression-v1-${{ github.sha }}
          restore-keys: native-${{ runner.os }}-${{ runner.arch }}-regression-v1-
      - name: Install locked dependencies
        run: |
          if npm ci > /tmp/coc-npm-ci.log 2>&1; then
            cat /tmp/coc-npm-ci.log
          else
            cat /tmp/coc-npm-ci.log
            python3 - <<'PY'
          import pathlib
          for line in pathlib.Path('/tmp/coc-npm-ci.log').read_text().splitlines()[-20:]:
              text = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Dependency installation::' + text)
          PY
            exit 1
          fi
      - run: python3 scripts/ci-command.py npm run lint && python3 scripts/ci-command.py npm run lint:cpp && python3 scripts/ci-command.py npm run typecheck && python3 scripts/ci-command.py npm run protocol:check
      - name: Build with compiler cache
        run: |
          ccache --zero-stats
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          npm run build
      - run: npm test
      - run: npm run test:tls
      - run: python3 scripts/ci-command.py npm run test:billing
      - run: python3 tests/native-login.py
      - run: npm run test:backup
      - run: npm run test:release
      - run: npm run test:update
      - run: npx playwright install --with-deps chromium
      - run: python3 scripts/ci-command.py npm run test:e2e && python3 scripts/ci-command.py npm run test:ui && python3 scripts/ci-command.py npm run test:billing:web
        env:
          COC_ARTIFACT_DIR: .local/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: .local/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: verified-web
          path: dist/web
          if-no-files-found: error
      - name: Report compiler cache statistics
        if: always() && steps.compiler-cache.outcome == 'success'
        run: ccache --show-stats
      - uses: actions/cache/save@v4
        if: always() && steps.compiler-cache.outcome == 'success' && steps.compiler-cache.outputs.cache-hit != 'true'
        with:
          path: .local/ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
  linux-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu20.04
            image: ubuntu:20.04
          - platform: debian12
            image: debian:12
    container: ${{ matrix.image }}
    steps:
      - name: Install target build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git ca-certificates build-essential cmake ccache libboost-system-dev libssl-dev libsqlite3-dev nlohmann-json3-dev python3
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
      - uses: actions/cache/restore@v4
        id: compiler-cache
        with:
          path: .local/ccache
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-release-v1-${{ github.sha }}
          restore-keys: native-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-release-v1-
      - name: Build and test target binaries
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ccache --zero-stats
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j 2
          cmake -E chdir build ctest --output-on-failure
          python3 tests/native-login.py
      - name: Package verified Linux binaries
        run: python3 scripts/package-release.py --build-dir build --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.platform }}
          path: dist/web/downloads
          if-no-files-found: error
      - name: Report compiler cache statistics
        if: always() && steps.compiler-cache.outcome == 'success'
        run: ccache --show-stats
      - uses: actions/cache/save@v4
        if: always() && steps.compiler-cache.outcome == 'success' && steps.compiler-cache.outputs.cache-hit != 'true'
        with:
          path: .local/ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
  linux-musl:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: compiler-cache
        with:
          path: .local/ccache
          key: native-${{ runner.os }}-${{ runner.arch }}-musl-release-v1-${{ github.sha }}
          restore-keys: native-${{ runner.os }}-${{ runner.arch }}-musl-release-v1-
      - uses: docker/setup-buildx-action@v3
      - name: Prepare Alpine musl toolchain
        id: musl-toolchain
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile.musl
          load: true
          tags: coc-musl-build:latest
          cache-from: type=gha,scope=musl-toolchain
          cache-to: type=gha,scope=musl-toolchain,mode=max
      - name: Build, test and package fully static Linux x86_64 binaries
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" \
            -e CCACHE_DIR=/workspace/.local/ccache -e CCACHE_BASEDIR=/workspace \
            -e CCACHE_COMPILERCHECK -e CCACHE_COMPRESS -e CCACHE_MAXSIZE coc-musl-build sh -ec '
            git config --global --add safe.directory /workspace
            ccache --zero-stats
            cmake -S . -B build-musl -DCMAKE_BUILD_TYPE=Release -DCOC_STATIC_MUSL=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            cmake --build build-musl -j 2
            ctest --test-dir build-musl --output-on-failure
            COC_AGENT_BINARY=build-musl/coc-agent COC_CLI_BINARY=build-musl/coc-client python3 tests/native-login.py
            python3 scripts/package-release.py --build-dir build-musl --platform musl
          '
      - name: Verify startup and musl update selection on the glibc host
        run: |
          ./build-musl/coc-agent --version
          ./build-musl/coc-client --version
          ./build-musl/coc-agent --help
          ./build-musl/coc-client --help
          COC_AGENT_BINARY=build-musl/coc-agent COC_CLI_BINARY=build-musl/coc-client python3 tests/native-update.py --musl
      - uses: actions/upload-artifact@v4
        with:
          name: linux-musl
          path: dist/web/downloads
          if-no-files-found: error
      - name: Report compiler cache statistics
        if: always() && steps.compiler-cache.outcome == 'success' && steps.musl-toolchain.outcome == 'success'
        run: docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -e CCACHE_DIR=/workspace/.local/ccache coc-musl-build ccache --show-stats
      - uses: actions/cache/save@v4
        if: always() && steps.compiler-cache.outcome == 'success' && steps.compiler-cache.outputs.cache-hit != 'true'
        with:
          path: .local/ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CCACHE_MAXSIZE: 512M
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ccache libboost-system-dev libssl-dev libsqlite3-dev nlohmann-json3-dev
      - uses: actions/cache/restore@v4
        id: compiler-cache
        with:
          path: .local/ccache
          key: native-${{ runner.os }}-${{ runner.arch }}-sanitizers-v1-${{ github.sha }}
          restore-keys: native-${{ runner.os }}-${{ runner.arch }}-sanitizers-v1-
      - run: ccache --zero-stats && cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DCOC_SANITIZE=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache && cmake --build build-sanitize -j 2
      - run: ctest --test-dir build-sanitize --output-on-failure
      - name: Report compiler cache statistics
        if: always() && steps.compiler-cache.outcome == 'success'
        run: ccache --show-stats
      - uses: actions/cache/save@v4
        if: always() && steps.compiler-cache.outcome == 'success' && steps.compiler-cache.outputs.cache-hit != 'true'
        with:
          path: .local/ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.local/vcpkg-cache
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.local/vcpkg-downloads
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep source bytes identical for build provenance on every platform.
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        id: windows-dependencies
        with:
          path: .local/vcpkg-cache
          key: windows-2022-vcpkg-x64-static-${{ hashFiles('vcpkg.json') }}
          restore-keys: windows-2022-vcpkg-x64-static-
      - uses: actions/cache/restore@v4
        id: windows-downloads
        with:
          path: .local/vcpkg-downloads
          key: windows-2022-vcpkg-downloads-${{ hashFiles('vcpkg.json') }}
          restore-keys: windows-2022-vcpkg-downloads-
      - name: Prepare dependency cache
        run: New-Item -ItemType Directory -Force .local/vcpkg-cache, .local/vcpkg-downloads | Out-Null
      - name: Configure Windows x64 with static dependencies
        shell: pwsh
        run: >-
          python scripts/ci-command.py cmake -S . -B build-windows -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
      - run: python scripts/ci-command.py cmake --build build-windows --config Release --parallel 2
      - run: python scripts/ci-command.py ctest --test-dir build-windows -C Release --output-on-failure
      - name: Verify native Windows login recovery and generated defaults
        run: python scripts/ci-command.py python tests/native-login.py
        env:
          COC_AGENT_BINARY: build-windows/Release/coc-agent.exe
          COC_CLI_BINARY: build-windows/Release/coc-client.exe
      - name: Validate executable metadata and startup
        shell: pwsh
        run: |
          ./build-windows/Release/coc-agent.exe --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./build-windows/Release/coc-client.exe --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./build-windows/Release/coc-agent.exe --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./build-windows/Release/coc-client.exe --help
          exit $LASTEXITCODE
      - name: Verify Windows release packaging guards
        run: python scripts/ci-command.py python tests/windows-release.py
      - name: Package verified Windows x64 binaries
        run: python scripts/ci-command.py python scripts/package-release.py --build-dir build-windows/Release --platform windows-x64
      - uses: actions/cache/save@v4
        if: always() && steps.windows-dependencies.outputs.cache-hit != 'true'
        with:
          path: .local/vcpkg-cache
          key: windows-2022-vcpkg-x64-static-${{ hashFiles('vcpkg.json') }}
      - uses: actions/cache/save@v4
        if: always() && steps.windows-downloads.outputs.cache-hit != 'true'
        with:
          path: .local/vcpkg-downloads
          key: windows-2022-vcpkg-downloads-${{ hashFiles('vcpkg.json') }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/web/downloads/*.zip
            dist/web/downloads/*source.tar.gz
            dist/web/downloads/SHA256SUMS
            dist/web/downloads/index.json
  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [regression, sanitizers, linux-release, linux-musl, windows-x64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: .local/release-artifacts
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: .local/release-artifacts/windows-x64
      - uses: actions/download-artifact@v4
        with:
          name: verified-web
          path: .local/release-artifacts/verified-web
      - name: Assemble and verify release identity and checksums
        run: python3 scripts/assemble-release.py --artifacts .local/release-artifacts --tag "$GITHUB_REF_NAME"
      - name: Bundle verified site and downloads
        run: tar -czf ".local/coc-${GITHUB_REF_NAME#v}-site.tar.gz" -C dist/web .
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/web/downloads/* .local/*-site.tar.gz
          --verify-tag --title "$GITHUB_REF_NAME"
          --notes 'Linux x86_64 fully static musl Agent and CLI, alongside Ubuntu 20.04, Debian 12 and Windows x64 packages. Musl builds retain musl for self-updates. All platform packages and site assets passed GitHub Actions.'
